<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVAR HUD for Slither</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">

      <!-- ── Header ── -->
      <header class="brand">
        <img src="logo.svg" alt="Logo" class="logo" />
        <div class="brand-text">
          <h1>EVAR HUD</h1>
          <p>Slither Analytics</p>
        </div>
      </header>

      <!-- ── Quick Stats ── -->
      <div class="quick-stats">
        <div class="qs-item">
          <span class="qs-val" id="qsGames">&mdash;</span>
          <span class="qs-label">Games</span>
        </div>
        <div class="qs-item">
          <span class="qs-val" id="qsBest">&mdash;</span>
          <span class="qs-label">Best Size</span>
        </div>
        <div class="qs-item">
          <span class="qs-val" id="qsKills">&mdash;</span>
          <span class="qs-label">Total Kills</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ── Theme Picker ── -->
      <section class="section">
        <div class="section-header">HUD Theme</div>
        <div class="theme-row" id="themePicker">
          <button class="theme-swatch" data-theme="neon" title="Neon Serpent">
            <span class="swatch-fill swatch-neon"></span>
            <span class="swatch-name">Neon</span>
          </button>
          <button class="theme-swatch" data-theme="ember" title="Ember">
            <span class="swatch-fill swatch-ember"></span>
            <span class="swatch-name">Ember</span>
          </button>
          <button class="theme-swatch" data-theme="ghost" title="Ghost">
            <span class="swatch-fill swatch-ghost"></span>
            <span class="swatch-name">Ghost</span>
          </button>
          <button class="theme-swatch" data-theme="matrix" title="Matrix">
            <span class="swatch-fill swatch-matrix"></span>
            <span class="swatch-name">Matrix</span>
          </button>
          <button class="theme-swatch" data-theme="royal" title="Royal">
            <span class="swatch-fill swatch-royal"></span>
            <span class="swatch-name">Royal</span>
          </button>
        </div>
      </section>

      <div class="divider"></div>

      <!-- ── HUD Metrics Toggles ── -->
      <section class="section">
        <div class="section-header">HUD Metrics</div>
        <div class="toggle-grid" id="toggleGrid">
          <label class="toggle-item">
            <input type="checkbox" data-metric="chart" checked />
            <span class="toggle-track"><span class="toggle-knob"></span></span>
            <span class="toggle-label">Growth Chart</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" data-metric="kills" checked />
            <span class="toggle-track"><span class="toggle-knob"></span></span>
            <span class="toggle-label">Kill Count</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" data-metric="score" checked />
            <span class="toggle-track"><span class="toggle-knob"></span></span>
            <span class="toggle-label">Score</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" data-metric="timer" checked />
            <span class="toggle-track"><span class="toggle-knob"></span></span>
            <span class="toggle-label">Game Timer</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" data-metric="notifications" checked />
            <span class="toggle-track"><span class="toggle-knob"></span></span>
            <span class="toggle-label">Notifications</span>
          </label>
        </div>
      </section>

      <div class="divider"></div>

      <!-- ── Sliders ── -->
      <section class="section">
        <div class="slider-block">
          <div class="slider-header">
            <span class="slider-label">Background Opacity</span>
            <span class="slider-val" id="opacityLabel">92%</span>
          </div>
          <input type="range" class="custom-range" id="opacitySlider" min="0" max="100" value="92" step="1" />
        </div>
        <div class="slider-block">
          <div class="slider-header">
            <span class="slider-label">HUD Size</span>
            <span class="slider-val" id="scaleLabel">100%</span>
          </div>
          <input type="range" class="custom-range" id="scaleSlider" min="50" max="200" value="100" step="5" />
        </div>
      </section>

      <div class="divider"></div>

      <!-- ── Action ── -->
      <button id="openStats" type="button" class="btn-primary">Open Dashboard</button>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
