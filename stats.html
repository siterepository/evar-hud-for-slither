<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVAR HUD — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="logo.svg" alt="Logo" class="logo" />
        <div>
          <h1>EVAR HUD</h1>
          <p>Player Analytics</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="exportButton" type="button" class="btn-ghost">Export</button>
        <button id="refreshButton" type="button" class="btn-ghost">Refresh</button>
      </div>
    </header>

    <div class="flow">

      <!-- Hero summary cards -->
      <section class="summary-grid" id="summaryCards"></section>

      <!-- Insights: Radar + Personal Bests -->
      <section class="duo-row">
        <article class="panel strengths-panel">
          <h2>Player Profile</h2>
          <div id="strengthBars" class="strength-bars"></div>
        </article>
        <article class="panel">
          <h2>Personal Bests</h2>
          <div id="pbDashboard" class="stat-list"></div>
        </article>
      </section>

      <!-- Charts: Score Trend + Distribution -->
      <section class="duo-row">
        <article class="panel wide-panel">
          <h2>Score Trend</h2>
          <canvas id="scoreTrendChart" width="900" height="260"></canvas>
        </article>
        <article class="panel narrow-panel">
          <h2>Score Distribution</h2>
          <canvas id="scoreDistChart" width="400" height="260"></canvas>
        </article>
      </section>

      <!-- Charts: Kills/Duration + Averages -->
      <section class="duo-row">
        <article class="panel wide-panel">
          <h2>Kills &amp; Duration</h2>
          <canvas id="killsDurationChart" width="900" height="260"></canvas>
        </article>
        <article class="panel narrow-panel">
          <h2>Averages</h2>
          <div id="avgDashboard" class="stat-list"></div>
        </article>
      </section>

      <!-- History table -->
      <section class="panel table-panel">
        <h2>Game History</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Name</th>
                <th>Duration</th>
                <th>Kills</th>
                <th>Final</th>
                <th>Max</th>
                <th>Gain</th>
                <th>Spike</th>
                <th>To Max</th>
              </tr>
            </thead>
            <tbody id="historyRows"></tbody>
          </table>
        </div>
        <p id="emptyState" class="empty">No game history yet. Play a round and come back.</p>
      </section>

    </div>

    <script src="stats.js"></script>
  </body>
</html>
